[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lara-lottie-editor"
version = "1.1.0"
description = "Desktop GUI for editing image assets in Lottie animations"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[tool.setuptools]
py-modules = ["lottie_assets", "lara"]
